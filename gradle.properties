org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
org.gradle.configuration-cache=false
# Full JDK 21 installed via Homebrew (`brew install openjdk@21`). Unlike Android
# Studio's bundled JBR, this includes jpackage, which Compose Desktop needs to
# build native distributions / self-contained app images. Change this if you
# point the project at another JDK.
org.gradle.java.home=/home/linuxbrew/.linuxbrew/opt/openjdk@21/libexec
